# actionlint 1.7.12 doesn't know the `$/` self-repository syntax yet, and
# reports every `uses: $/...` as a missing ref. GitHub runners 2.336.0 and
# later support it. Drop this once actionlint does.
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'specifying action "\$/[^"]+" in invalid format because ref is missing'
      - 'reusable workflow call "\$/[^"]+" at "uses" is not following the format'
