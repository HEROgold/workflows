name: Publish documentation

# Called from a repo's CI workflow after docs.yml. Pages serves the gh-pages
# branch. A push to the default branch publishes to its root, and each PR from
# the same repo gets a preview under pr-previews/pr-<n>/. Fork PRs get no
# preview, because their token can't push to gh-pages. Both actions fetch and
# rebase when another run pushed first.
#
# Inputs:
#   artifact-name  Name of the artifact docs.yml uploaded.
#   default-branch Branch whose pushes publish to the gh-pages root.
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: site
      default-branch:
        type: string
        default: main

permissions: {}

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: site

      - name: Deploy the PR preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: deploy

  remove-preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove the PR preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-previews
          action: remove

  deploy:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.default-branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: site

      # Only the root needs .nojekyll. In a preview it would outlive the
      # preview's removal, which skips hidden files.
      - name: Keep Pages from running Jekyll
        run: touch site/.nojekyll

      - name: Publish to the gh-pages root
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-previews
