name: Documentation

# Called from a repo's CI workflow. Builds the docs site and uploads it as an
# artifact. docs-publish.yml publishes that artifact, so a cancelled publish
# never fails this check.
#
# Inputs:
#   build-command  Shell commands that build the site. Runs with bash.
#   site-dir       Folder the build writes the site to. Cached and uploaded.
#   artifact-name  Name of the uploaded artifact.
#   python-version Python version the setup action installs.
#   sync-args      Extra arguments for uv sync, for example "--group docs".
on:
  workflow_call:
    inputs:
      build-command:
        type: string
        default: |
          uv run pdoc confkit -o docs/api
          uv run zensical build --clean
      site-dir:
        type: string
        default: site
      artifact-name:
        type: string
        default: site
      python-version:
        type: string
        default: "3.13"
      sync-args:
        type: string
        default: --group docs

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A hit means the site for these exact inputs is already built.
      - name: Cache the built site
        id: cache-site
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.site-dir }}
          key: ${{ runner.os }}-site-${{ inputs.site-dir }}-${{ hashFiles('src/**', 'docs/**', 'zensical.toml', 'mkdocs.yml', 'pyproject.toml', 'uv.lock') }}

      - name: Set up the project
        if: steps.cache-site.outputs.cache-hit != 'true'
        uses: $/.github/actions/setup-uv-python
        with:
          python-version: ${{ inputs.python-version }}
          sync-args: ${{ inputs.sync-args }}

      - name: Build the site
        if: steps.cache-site.outputs.cache-hit != 'true'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -c "$BUILD_COMMAND"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.site-dir }}
